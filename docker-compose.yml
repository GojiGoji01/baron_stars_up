services:
  postgres:
    image: postgres:16
    container_name: tg_star_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tg_star
      POSTGRES_USER: tg_star
      POSTGRES_PASSWORD: tg_star_password
    ports:
      - "5432:5432"
    volumes:
      - tg_star_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tg_star_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tg_star_postgres_data:
